<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Znow — India’s Coffee App</title>
    <meta name="description" content="Get your favourite coffee delivered in minutes with Znow." />
    <link rel="icon" type="image/png" href="/assets/znow_logo_transparent.png" />
    <link rel="preload" as="image" href="/assets/znow_desktop_artboard_2x.png" media="(min-width: 768px)" />
    <link rel="preload" as="image" href="/assets/znow_mobile_artboard_2x.png" media="(max-width: 767px)" />
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; background: #fff; }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; min-width: 320px; width: 100%; background: #fff; }
      body { overflow-x: hidden; }
      .page { position: relative; width: min(100%, 1512px); margin-inline: auto; line-height: 0; }
      .artboard { display: block; width: 100%; height: auto; }
      .hotspot {
        position: absolute;
        display: block;
        z-index: 1;
        border-radius: 8px;
        line-height: normal;
        -webkit-tap-highlight-color: transparent;
      }
      .hotspot:focus-visible { outline: 3px solid #0b68d7; outline-offset: 3px; background: rgb(11 104 215 / 14%); }
      .desktop-only { display: block; }
      .mobile-only { display: none; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
      dialog {
        width: min(92vw, 380px); border: 1px solid #dce6eb; border-radius: 20px;
        padding: 28px; color: #111; background: white; box-shadow: 0 20px 70px rgb(0 0 0 / 24%);
        font: 16px/1.45 Arial, Helvetica, sans-serif;
      }
      dialog::backdrop { background: rgb(12 26 35 / 52%); }
      dialog h2 { margin: 0 32px 8px 0; font-size: 22px; line-height: 1.2; }
      dialog p { margin: 0 0 20px; color: #46535a; }
      .picker-badges { display: grid; justify-items: center; gap: 12px; }
      .picker-badges a { display: flex; width: 100%; justify-content: center; }
      .picker-badges img { display: block; width: min(100%, 280px); height: auto; }
      .close-picker {
        position: absolute; top: 12px; right: 14px; border: 0; border-radius: 50%;
        width: 36px; height: 36px; background: #f0f4f6; color: #111; font-size: 24px; cursor: pointer;
      }
      @media (max-width: 767px) {
        .desktop-only { display: none; }
        .mobile-only { display: block; }
      }
    </style>
  </head>
  <body>
    <main class="page" aria-label="Znow coffee app website">
      <h1 class="sr-only">Znow — India’s Coffee App</h1>
      <picture>
        <source media="(max-width: 767px)" srcset="/assets/znow_mobile_artboard_2x.png" />
        <img class="artboard" src="/assets/znow_desktop_artboard_2x.png" alt="Znow coffee delivery website: coffee delivered in minutes, daily coffee, menu, app download and contact information." width="3024" height="15890" fetchpriority="high" />
      </picture>

      <!-- Desktop app CTAs open the store chooser. -->
      <a class="hotspot desktop-only chooser" style="left:42.6%;top:37.4%;width:16%;height:.9%" href="#download" aria-label="Choose where to download the Znow app"><span class="sr-only">Get the app</span></a>
      <a class="hotspot desktop-only chooser" style="left:47.6%;top:47%;width:15.4%;height:.9%" href="#download" aria-label="Choose where to download the Znow app"><span class="sr-only">Get the app</span></a>
      <a class="hotspot desktop-only" style="left:5.2%;top:84.55%;width:12.2%;height:.82%" href="https://apps.apple.com/in/app/znow-coffee-in-minutes/id6809353250" target="_blank" rel="noopener" aria-label="Download Znow on the App Store"><span class="sr-only">App Store</span></a>
      <a class="hotspot desktop-only" style="left:18.8%;top:84.55%;width:12.1%;height:.82%" href="https://play.google.com/store/apps/details?id=com.znow.app" target="_blank" rel="noopener" aria-label="Download Znow on Google Play"><span class="sr-only">Google Play</span></a>
      <a class="hotspot desktop-only" style="left:73.4%;top:93.95%;width:12%;height:.72%" href="https://apps.apple.com/in/app/znow-coffee-in-minutes/id6809353250" target="_blank" rel="noopener" aria-label="Download Znow on the App Store"><span class="sr-only">App Store</span></a>
      <a class="hotspot desktop-only" style="left:73.4%;top:96.05%;width:12%;height:.72%" href="https://play.google.com/store/apps/details?id=com.znow.app" target="_blank" rel="noopener" aria-label="Download Znow on Google Play"><span class="sr-only">Google Play</span></a>

      <!-- Mobile calls to action and store badges. -->
      <a class="hotspot mobile-only chooser" style="left:35%;top:23.7%;width:30%;height:.75%" href="#download" aria-label="Choose where to download the Znow app"><span class="sr-only">Get the app</span></a>
      <a class="hotspot mobile-only chooser" style="left:35%;top:31.5%;width:30%;height:.75%" href="#download" aria-label="Choose where to download the Znow app"><span class="sr-only">Get the app</span></a>
      <a class="hotspot mobile-only chooser" style="left:35%;top:42.2%;width:30%;height:.75%" href="#download" aria-label="Choose where to download the Znow app"><span class="sr-only">Get the app</span></a>
      <a class="hotspot mobile-only" style="left:29%;top:84.8%;width:42%;height:.82%" href="https://play.google.com/store/apps/details?id=com.znow.app" target="_blank" rel="noopener" aria-label="Download Znow on Google Play"><span class="sr-only">Google Play</span></a>
      <a class="hotspot mobile-only" style="left:29%;top:87.4%;width:42%;height:.82%" href="https://apps.apple.com/in/app/znow-coffee-in-minutes/id6809353250" target="_blank" rel="noopener" aria-label="Download Znow on the App Store"><span class="sr-only">App Store</span></a>
      <a class="hotspot mobile-only" style="left:4%;top:95.7%;width:42%;height:.85%" href="https://apps.apple.com/in/app/znow-coffee-in-minutes/id6809353250" target="_blank" rel="noopener" aria-label="Download Znow on the App Store"><span class="sr-only">App Store</span></a>
      <a class="hotspot mobile-only" style="left:4%;top:97.45%;width:42%;height:.85%" href="https://play.google.com/store/apps/details?id=com.znow.app" target="_blank" rel="noopener" aria-label="Download Znow on Google Play"><span class="sr-only">Google Play</span></a>
    </main>

    <dialog id="store-picker" aria-labelledby="picker-title">
      <button class="close-picker" type="button" aria-label="Close">×</button>
      <h2 id="picker-title">Get the Znow app</h2>
      <p>Choose your app store to continue.</p>
      <div class="picker-badges">
        <a href="https://apps.apple.com/in/app/znow-coffee-in-minutes/id6809353250" target="_blank" rel="noopener" aria-label="Download Znow on the App Store"><img src="/assets/badge_appstore_transparent.png" alt="Download on the App Store" /></a>
        <a href="https://play.google.com/store/apps/details?id=com.znow.app" target="_blank" rel="noopener" aria-label="Get Znow on Google Play"><img src="/assets/badge_playstore_transparent.png" alt="Get it on Google Play" /></a>
      </div>
    </dialog>
    <script>
      const picker = document.getElementById('store-picker');
      document.querySelectorAll('.chooser').forEach((link) => link.addEventListener('click', (event) => {
        event.preventDefault();
        picker.showModal();
      }));
      picker.querySelector('.close-picker').addEventListener('click', () => picker.close());
      picker.addEventListener('click', (event) => { if (event.target === picker) picker.close(); });
    </script>
  </body>
</html>
